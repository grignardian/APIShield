<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APIShield — Add & Manage Targets</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="container">
    <header>
      <div>
        <div class="brand-title">APIShield</div>
        <div class="brand-subtitle">Automated API Security Testing & Vulnerability Assessment</div>
      </div>
      <nav class="nav-links">
        <a href="/" class="nav-link">Security Analysis</a>
        <a href="/targets" class="nav-link active">Add & Manage Targets</a>
      </nav>
    </header>

    <!-- Add / Edit Target Form -->
    <div class="panel-card">
      <div class="section-title" id="formTitle">Add New Target API</div>
      <form class="add-form" onsubmit="handleSaveEndpoint(event)">
        <div class="form-group">
          <label class="form-label" for="newEpName">Target Name</label>
          <input type="text" id="newEpName" class="input-field" placeholder="e.g. User Profile API" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="newEpUrl">Endpoint URL</label>
          <input type="url" id="newEpUrl" class="input-field" placeholder="https://api.example.com/v1/user" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="newEpMethod">HTTP Method</label>
          <select id="newEpMethod" class="input-field">
            <option value="GET">GET</option>
            <option value="POST">POST</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" for="newEpAuth">Auth Type</label>
          <select id="newEpAuth" class="input-field">
            <option value="none">No Auth</option>
            <option value="bearer">Bearer Token</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" for="newEpToken">Auth Token (Optional)</label>
          <input type="text" id="newEpToken" class="input-field" placeholder="secret-token-123">
        </div>
        <div class="form-group" style="justify-content: flex-end; flex-direction: row; align-items: flex-end; gap: 0.5rem;">
          <button type="submit" class="btn btn-blue" id="submitBtn" style="justify-content: center; flex: 1;">Save Target</button>
          <button type="button" class="btn" id="cancelEditBtn" onclick="resetForm()" style="display: none;">Cancel</button>
        </div>
      </form>
    </div>

    <!-- Configured Targets Table -->
    <div class="panel-card">
      <div class="section-title">Configured Target Endpoints</div>
      <table class="targets-table">
        <thead>
          <tr>
            <th>Name</th>
            <th>URL</th>
            <th>Method</th>
            <th>Auth Type</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="endpointsTableBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    let allEndpoints = [];
    let editingId = null;

    async function loadEndpoints() {
      try {
        const res = await fetch("/api/endpoints");
        allEndpoints = await res.json();
        const tbody = document.getElementById("endpointsTableBody");

        if (!allEndpoints.length) {
          tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color: var(--text-dim);">No endpoints configured yet.</td></tr>';
          return;
        }

        tbody.innerHTML = allEndpoints.map(ep => `
          <tr>
            <td>${ep.name}</td>
            <td><code>${ep.url}</code></td>
            <td><span class="badge badge-low">${ep.method}</span></td>
            <td>${ep.auth_type}</td>
            <td style="display: flex; gap: 0.5rem;">
              <a href="/?endpoint_id=${ep.id}" class="btn btn-blue" style="padding: 0.35rem 0.75rem; font-size: 0.75rem;">Analyze</a>
              <button class="btn" style="padding: 0.35rem 0.7rem; font-size: 0.75rem;" onclick="startEdit(${ep.id})">Edit</button>
              <button class="btn btn-coral" style="padding: 0.35rem 0.6rem; font-size: 0.75rem;" onclick="deleteEndpoint(${ep.id})">Delete</button>
            </td>
          </tr>
        `).join("");
      } catch (err) {
        console.error("Failed to load endpoints:", err);
      }
    }

    function startEdit(id) {
      const ep = allEndpoints.find(item => item.id === id);
      if (!ep) return;

      editingId = id;
      document.getElementById("newEpName").value = ep.name;
      document.getElementById("newEpUrl").value = ep.url;
      document.getElementById("newEpMethod").value = ep.method;
      document.getElementById("newEpAuth").value = ep.auth_type;
      document.getElementById("newEpToken").value = ep.auth_value || "";

      document.getElementById("formTitle").innerText = "Edit Target API";
      document.getElementById("submitBtn").innerText = "Update Target";
      document.getElementById("cancelEditBtn").style.display = "inline-flex";
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function resetForm() {
      editingId = null;
      document.querySelector(".add-form").reset();
      document.getElementById("formTitle").innerText = "Add New Target API";
      document.getElementById("submitBtn").innerText = "Save Target";
      document.getElementById("cancelEditBtn").style.display = "none";
    }

    async function handleSaveEndpoint(e) {
      e.preventDefault();
      const payload = {
        name: document.getElementById("newEpName").value,
        url: document.getElementById("newEpUrl").value,
        method: document.getElementById("newEpMethod").value,
        auth_type: document.getElementById("newEpAuth").value,
        auth_value: document.getElementById("newEpToken").value
      };

      const url = editingId ? `/api/endpoints/${editingId}` : "/api/endpoints";
      const method = editingId ? "PUT" : "POST";

      try {
        const res = await fetch(url, {
          method,
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        if (res.ok) {
          resetForm();
          await loadEndpoints();
        }
      } catch (err) {
        alert("Failed to save endpoint: " + err.message);
      }
    }

    async function deleteEndpoint(id) {
      if (!confirm("Are you sure you want to remove this endpoint?")) return;
      try {
        await fetch(`/api/endpoints/${id}`, { method: "DELETE" });
        if (editingId === id) resetForm();
        await loadEndpoints();
      } catch (err) {
        alert("Failed to delete endpoint: " + err.message);
      }
    }

    window.addEventListener("DOMContentLoaded", loadEndpoints);
  </script>
</body>
</html>
